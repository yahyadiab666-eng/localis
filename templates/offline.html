<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Localis — Sin conexión</title>
  <meta name="theme-color" content="#F59E0B">
  <style>
    :root { color-scheme: light; }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
      padding: 1.5rem; background: #f5f0e8; color: #1c1917;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    .card {
      width: 100%; max-width: 26rem; background: #fff; border: 1px solid #e7e5e4;
      border-radius: 1rem; padding: 2rem; text-align: center; box-shadow: 0 10px 30px rgba(0,0,0,.08);
    }
    .icono { width: 56px; height: 56px; margin: 0 auto 1rem; border-radius: 1rem; background: #fef3c7;
      display: flex; align-items: center; justify-content: center; font-size: 28px; }
    h1 { font-size: 1.35rem; margin: 0 0 .5rem; }
    p { color: #57534e; font-size: .92rem; line-height: 1.5; margin: 0 0 1.5rem; }
    button, a.boton {
      display: block; width: 100%; padding: .85rem 1rem; border: 0; border-radius: 999px;
      background: #f59e0b; color: #1c1917; font-weight: 700; font-size: .95rem;
      text-decoration: none; cursor: pointer; margin-bottom: .6rem;
    }
    a.secundario { display: block; color: #78716c; font-size: .85rem; text-decoration: none; }
  </style>
</head>
<body>
  <main class="card">
    <div class="icono" aria-hidden="true">📡</div>
    <h1>Sin conexión</h1>
    <p>No pudimos contactar con Localis. Revisa tu conexión e inténtalo de nuevo. Las tiendas que ya visitaste pueden seguir disponibles.</p>
    <button type="button" onclick="window.location.reload()">Reintentar</button>
    <a class="secundario" href="/">Volver al inicio</a>
  </main>
</body>
</html>
