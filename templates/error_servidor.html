<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Localis — {{ titulo }}</title>
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;600;700&family=Fraunces:wght@700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'DM Sans', sans-serif; }
    .font-display { font-family: 'Fraunces', serif; }
  </style>
</head>
<body class="min-h-screen flex items-center justify-center px-6" style="background: rgb(245, 240, 232);">
  <div class="max-w-md w-full bg-white rounded-2xl shadow-lg border border-stone-200 p-8 text-center">
    <div class="text-5xl font-display font-bold text-amber-500 mb-2">{{ codigo }}</div>
    <h1 class="font-display text-2xl font-bold text-gray-900 mb-3">{{ titulo }}</h1>
    <p class="text-stone-600 text-sm leading-relaxed mb-6">{{ mensaje }}</p>
    <div class="flex flex-col gap-2">
      <a href="{{ url_for('index') }}"
         class="inline-block py-3 px-6 rounded-full font-bold text-sm"
         style="background: rgb(245, 158, 11); color: rgb(26, 26, 26);">
        Volver al inicio
      </a>
      {% if sesion_activa %}
        <a href="{{ url_for('panel_comercio') }}"
           class="inline-block py-2 px-6 rounded-full text-sm text-stone-600 hover:text-stone-900">
          Ir a mi panel de comercio
        </a>
      {% endif %}
    </div>
  </div>
</body>
</html>
