<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Localis - Iniciar Sesión</title>
    
    <!-- Fonts unificadas -->
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Fraunces:wght@600;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/responsive.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/flash.css') }}">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'DM Sans', sans-serif;
        }
        .font-display {
            font-family: 'Fraunces', serif;
        }
        body {
            background-color: rgb(254, 251, 246);
            color: #1a1a1a;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }
        header {
            background-color: rgb(17, 17, 17);
            color: white;
            padding: 1.25rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }
        header h1 {
            font-size: 1.5rem;
            font-weight: 900;
            letter-spacing: -0.025em;
        }
        .nav-links a {
            color: white;
            text-decoration: none;
            margin-left: 15px;
            font-weight: 600;
            font-size: 0.9rem;
            transition: color 0.2s;
        }
        .nav-links a:hover {
            color: rgb(245, 158, 11);
        }
        .container-login {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 2rem 1rem;
        }
        .login-card {
            background: white;
            padding: 2.5rem;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.04);
            border: 1px solid rgb(245, 240, 232);
            width: 100%;
            max-width: 420px;
            text-align: center;
        }
        .login-card h2 {
            margin-bottom: 0.5rem;
            color: rgb(17, 17, 17);
            font-size: 1.75rem;
            font-weight: 700;
            letter-spacing: -0.02em;
        }
        .login-card p {
            color: #666;
            font-size: 0.95rem;
            margin-bottom: 2rem;
        }
        
        /* Sistema Dinámico de Alertas Flash */
        .alerta {
            padding: 0.75rem 1rem;
            border-radius: 8px;
            font-size: 0.9rem;
            font-weight: 500;
            margin-bottom: 1.25rem;
            text-align: center;
            border-left: 4px solid;
        }
        .alerta-error { background-color: #fde8e8; color: #9b1c1c; border-color: #f05252; }
        .alerta-exito { background-color: #def7ec; color: #03543f; border-color: #31c48d; }
        .alerta-info { background-color: #e1effe; color: #1e429f; border-color: #3f83f8; }

        /* BOTÓN DE GOOGLE */
        .btn-google {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            width: 100%;
            background-color: #ffffff;
            color: #3c4043;
            border: 1px solid #dadce0;
            padding: 0.85rem 1.5rem;
            border-radius: 9999px;
            font-size: 1rem;
            font-weight: 700;
            text-decoration: none;
            cursor: pointer;
            transition: background-color 0.2s, border-color 0.2s, box-shadow 0.2s, transform 0.1s;
        }
        .btn-google:hover {
            background-color: #f8f9fa;
            border-color: #d2e3fc;
            box-shadow: 0 2px 6px rgba(60,64,67,0.12);
        }
        .btn-google:active {
            transform: scale(0.98);
        }
        .btn-google svg {
            width: 20px;
            height: 20px;
        }
    </style>
</head>
<body>

    <header>
        <h1 class="font-display">localis</h1>
        <div class="nav-links">
            <a href="/">Inicio</a>
            <a href="{{ url_for('como_funciona') }}">Cómo funciona</a>
        </div>
    </header>

    <div class="container-login">
        <div class="login-card">
            
            <h2 class="font-display">Bienvenido</h2>
            <p>Accede a tu cuenta o regístrate en un clic</p>

            <!-- PROCESAMIENTO DE ALERTAS DESDE FLASK FLASH -->
            {% with messages = get_flashed_messages(with_categories=true) %}
              {% if messages %}
                {% for category, message in messages %}
                  <div class="alerta flash-auto-dismiss alerta-{{ 'exito' if category == 'exito' or category == 'success' else ('error' if category == 'error' or category == 'danger' else 'info') }}">
                    {{ message }}
                  </div>
                {% endfor %}
              {% endif %}
            {% endwith %}

            <!-- BOTÓN ÚNICO DE GOOGLE OAUTH -->
            <a href="/login/google" class="btn-google">
                <svg viewBox="0 0 24 24">
                    <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                    <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                    <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
                    <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
                </svg>
                Continuar con Google
            </a>

        </div>
    </div>

</body>
<script src="{{ url_for('static', filename='js/flash.js') }}"></script>
</html>
